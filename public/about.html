<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANDEI — Photography's Growth Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0D0D0D;
  --cream: #FDFAF4;
  --lime: #C8FF00;
  --coral: #FF5C3A;
  --sky: #3AABFF;
  --violet: #9B5EFF;
  --gold: #C8956C;
  --gold-light: #E8C4A8;
  --white: #FFFFFF;
  --mid: #888;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--cream);
  color:var(--ink);
  overflow-x:hidden;
}

/* ── HERO ── */
.hero{
  min-height:100vh;
  background:var(--ink);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 7vw;
}

/* animated blobs */
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  opacity:0.55;
  animation:drift 12s ease-in-out infinite alternate;
}
.blob-1{width:520px;height:520px;background:var(--lime);top:-120px;right:-80px;animation-delay:0s;}
.blob-2{width:380px;height:380px;background:var(--coral);bottom:-100px;left:-60px;animation-delay:-4s;}
.blob-3{width:280px;height:280px;background:var(--sky);top:40%;right:15%;animation-delay:-7s;}
@keyframes drift{
  0%{transform:translate(0,0) scale(1);}
  100%{transform:translate(30px,-40px) scale(1.08);}
}

/* grid overlay */
.hero::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:60px 60px;
  z-index:1;
}

.hero-content{position:relative;z-index:2;}

.hero-kicker{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(200,255,0,0.12);
  border:1px solid rgba(200,255,0,0.3);
  padding:6px 16px;
  border-radius:100px;
  font-size:0.72rem;
  font-weight:500;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--lime);
  margin-bottom:32px;
  animation:fadeUp 0.8s both;
}
.hero-kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--lime);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

.hero-logo{
  display:block;
  height:72px;
  margin-bottom:32px;
  animation:fadeUp 0.8s 0.1s both;
  filter:drop-shadow(0 0 40px rgba(200,149,108,0.5));
}

.hero-h1{
  font-family:'Syne',sans-serif;
  font-size:clamp(3.2rem,7vw,7rem);
  font-weight:800;
  line-height:0.95;
  color:var(--white);
  margin-bottom:28px;
  animation:fadeUp 0.8s 0.2s both;
}
.hero-h1 .accent{color:var(--lime);}
.hero-h1 .accent2{color:var(--coral);}

.hero-sub{
  font-size:clamp(1rem,1.5vw,1.2rem);
  font-weight:300;
  color:rgba(255,255,255,0.55);
  max-width:520px;
  line-height:1.7;
  margin-bottom:48px;
  animation:fadeUp 0.8s 0.3s both;
}

.hero-ctas{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  animation:fadeUp 0.8s 0.4s both;
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:16px 32px;
  font-family:'Syne',sans-serif;
  font-size:0.85rem;
  font-weight:700;
  letter-spacing:0.05em;
  text-decoration:none;
  border-radius:6px;
  transition:all 0.25s;
  cursor:pointer;
  border:none;
}
.btn-lime{background:var(--lime);color:var(--ink);}
.btn-lime:hover{background:#d4ff1a;transform:translateY(-2px);box-shadow:0 12px 40px rgba(200,255,0,0.35);}
.btn-ghost{background:transparent;color:var(--white);border:1.5px solid rgba(255,255,255,0.25);}
.btn-ghost:hover{border-color:var(--lime);color:var(--lime);}
.btn-wa{background:#25D366;color:#fff;}
.btn-wa:hover{background:#20c05b;transform:translateY(-2px);box-shadow:0 12px 40px rgba(37,211,102,0.4);}
.btn-coral{background:var(--coral);color:#fff;}
.btn-coral:hover{background:#ff4422;transform:translateY(-2px);}

/* floating camera illustration */
.hero-illustration{
  position:absolute;
  right:6vw;
  top:50%;
  transform:translateY(-50%);
  z-index:2;
  animation:float 6s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(-50%) rotate(-2deg);}
  50%{transform:translateY(calc(-50% - 20px)) rotate(2deg);}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(32px);}
  to{opacity:1;transform:translateY(0);}
}

/* ── TICKER ── */
.ticker{
  background:var(--lime);
  padding:14px 0;
  overflow:hidden;
  white-space:nowrap;
}
.ticker-inner{
  display:inline-flex;
  gap:0;
  animation:ticker 22s linear infinite;
}
.ticker-item{
  font-family:'Syne',sans-serif;
  font-size:0.8rem;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ink);
  padding:0 32px;
}
.ticker-sep{color:rgba(0,0,0,0.25);}
@keyframes ticker{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ── SECTIONS SHARED ── */
.sec{padding:96px 7vw;}
.sec-inner{max-width:1160px;margin:0 auto;}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:0.7rem;
  font-weight:700;
  letter-spacing:0.22em;
  text-transform:uppercase;
  margin-bottom:16px;
}
.eyebrow::before{content:'';width:20px;height:2px;background:currentColor;}
.eyebrow-lime{color:var(--lime);}
.eyebrow-coral{color:var(--coral);}
.eyebrow-sky{color:var(--sky);}
.eyebrow-violet{color:var(--violet);}

.big-title{
  font-family:'Syne',sans-serif;
  font-size:clamp(2.4rem,4.5vw,4rem);
  font-weight:800;
  line-height:1.05;
  margin-bottom:20px;
}
.body-text{
  font-size:1rem;
  font-weight:300;
  line-height:1.8;
  color:var(--mid);
  max-width:560px;
}

/* ── ABOUT / STATS ── */
.about-sec{background:var(--ink);}
.about-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;
  align-items:center;
}
.about-sec .big-title{color:var(--white);}
.about-sec .body-text{color:rgba(255,255,255,0.5);}

.stats-cluster{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2px;
  background:rgba(255,255,255,0.06);
}
.stat-box{
  background:var(--ink);
  padding:40px 36px;
  transition:background 0.3s;
}
.stat-box:hover{background:#161616;}
.stat-box:nth-child(1){border-top:3px solid var(--lime);}
.stat-box:nth-child(2){border-top:3px solid var(--coral);}
.stat-box:nth-child(3){border-top:3px solid var(--sky);}
.stat-box:nth-child(4){border-top:3px solid var(--violet);}

.stat-num{
  font-family:'Syne',sans-serif;
  font-size:3rem;
  font-weight:800;
  color:var(--white);
  line-height:1;
  margin-bottom:8px;
}
.stat-lbl{
  font-size:0.78rem;
  font-weight:400;
  color:rgba(255,255,255,0.4);
  letter-spacing:0.05em;
}

/* ── FEATURES ── */
.features-sec{background:var(--cream);}

.feat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:64px;
}

.feat-card{
  background:var(--white);
  border-radius:16px;
  padding:36px 32px;
  position:relative;
  overflow:hidden;
  transition:transform 0.3s, box-shadow 0.3s;
  border:1px solid rgba(0,0,0,0.06);
}
.feat-card:hover{transform:translateY(-6px);box-shadow:0 24px 60px rgba(0,0,0,0.1);}

.feat-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
}
.fc-lime::before{background:var(--lime);}
.fc-coral::before{background:var(--coral);}
.fc-sky::before{background:var(--sky);}
.fc-violet::before{background:var(--violet);}
.fc-gold::before{background:var(--gold);}
.fc-green::before{background:#25D366;}

.feat-icon-wrap{
  width:52px;height:52px;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:24px;
}
.fi-lime{background:rgba(200,255,0,0.15);}
.fi-coral{background:rgba(255,92,58,0.12);}
.fi-sky{background:rgba(58,171,255,0.12);}
.fi-violet{background:rgba(155,94,255,0.12);}
.fi-gold{background:rgba(200,149,108,0.15);}
.fi-green{background:rgba(37,211,102,0.12);}

.feat-icon-wrap svg{width:24px;height:24px;}

.feat-name{
  font-family:'Syne',sans-serif;
  font-size:1rem;
  font-weight:700;
  margin-bottom:10px;
}
.feat-desc{
  font-size:0.86rem;
  font-weight:300;
  line-height:1.7;
  color:var(--mid);
}

/* ── AI SECTION ── */
.ai-sec{
  background:var(--ink);
  position:relative;
  overflow:hidden;
}
.ai-sec::before{
  content:'';
  position:absolute;
  width:600px;height:600px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(155,94,255,0.2) 0%, transparent 70%);
  right:-100px;top:-100px;
  pointer-events:none;
}
.ai-sec::after{
  content:'';
  position:absolute;
  width:400px;height:400px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(58,171,255,0.15) 0%, transparent 70%);
  left:-80px;bottom:-80px;
  pointer-events:none;
}

.ai-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;
  align-items:center;
  position:relative;
  z-index:1;
}

.ai-steps{display:flex;flex-direction:column;gap:0;}

.ai-step{
  display:flex;
  gap:20px;
  padding:28px 0;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.ai-step:last-child{border:none;}

.step-badge{
  width:36px;height:36px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-family:'Syne',sans-serif;
  font-size:0.8rem;
  font-weight:800;
}
.sb-1{background:var(--violet);color:#fff;}
.sb-2{background:var(--sky);color:#fff;}
.sb-3{background:var(--lime);color:var(--ink);}
.sb-4{background:var(--coral);color:#fff;}

.step-t{
  font-family:'Syne',sans-serif;
  font-size:0.88rem;
  font-weight:700;
  color:#fff;
  margin-bottom:4px;
}
.step-d{
  font-size:0.83rem;
  font-weight:300;
  line-height:1.65;
  color:rgba(255,255,255,0.4);
}

/* ── AI Visual ── */
.ai-visual{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
  padding:40px;
  text-align:center;
}
.ai-visual .big-title{color:#fff;font-size:2.4rem;margin-bottom:16px;}
.ai-visual .body-text{color:rgba(255,255,255,0.45);margin:0 auto 32px;}

.selfie-demo{
  background:rgba(155,94,255,0.08);
  border:1px dashed rgba(155,94,255,0.3);
  border-radius:12px;
  padding:32px 24px;
  margin-bottom:24px;
}
.selfie-demo-text{
  font-size:0.78rem;
  color:rgba(255,255,255,0.4);
  margin-bottom:16px;
  letter-spacing:0.08em;
}
.selfie-faces{
  display:flex;
  justify-content:center;
  gap:-8px;
}
.face{
  width:48px;height:48px;
  border-radius:50%;
  border:2px solid var(--ink);
  margin-left:-8px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
  position:relative;
}
.face:first-child{margin-left:0;}
.face.highlighted{
  border-color:var(--violet);
  box-shadow:0 0 0 4px rgba(155,94,255,0.3);
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{box-shadow:0 0 0 4px rgba(155,94,255,0.3);}
  to{box-shadow:0 0 0 8px rgba(155,94,255,0.5);}
}

.match-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(155,94,255,0.15);
  border:1px solid rgba(155,94,255,0.3);
  color:var(--violet);
  font-size:0.72rem;
  font-weight:700;
  letter-spacing:0.1em;
  padding:6px 14px;
  border-radius:100px;
  margin-top:14px;
}
.match-chip::before{content:'✦';}

/* ── WHATSAPP SECTION ── */
.wa-sec{
  background:linear-gradient(135deg, #0D0D0D 0%, #0a1a0f 100%);
  position:relative;
  overflow:hidden;
}
.wa-sec::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at 60% 50%, rgba(37,211,102,0.12) 0%, transparent 65%);
}

.wa-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;
  align-items:center;
  position:relative;
  z-index:1;
}

.wa-badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:rgba(37,211,102,0.1);
  border:1px solid rgba(37,211,102,0.25);
  padding:8px 18px;
  border-radius:100px;
  font-size:0.7rem;
  font-weight:700;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:#25D366;
  margin-bottom:24px;
}
.wa-badge svg{width:16px;height:16px;fill:#25D366;}

.wa-sec .big-title{color:#fff;}
.wa-sec .body-text{color:rgba(255,255,255,0.5);margin-bottom:36px;}

.wa-features{
  display:flex;
  flex-direction:column;
  gap:16px;
  margin-bottom:40px;
}
.wa-feat{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 20px;
  background:rgba(37,211,102,0.05);
  border:1px solid rgba(37,211,102,0.1);
  border-radius:10px;
  font-size:0.88rem;
  font-weight:400;
  color:rgba(255,255,255,0.75);
}
.wa-feat .check{
  width:20px;height:20px;
  border-radius:50%;
  background:#25D366;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-size:0.65rem;
  color:#fff;
}

/* WA mockup */
.wa-mockup{
  background:#111;
  border-radius:20px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
}
.wa-mock-header{
  background:#1a2e20;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.wa-mock-avatar{
  width:36px;height:36px;
  border-radius:50%;
  background:linear-gradient(135deg,#25D366,#128C7E);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
}
.wa-mock-name{
  font-family:'Syne',sans-serif;
  font-size:0.88rem;
  font-weight:700;
  color:#fff;
}
.wa-mock-status{font-size:0.7rem;color:#25D366;}

.wa-mock-body{
  padding:20px;
  background:#0a1a0f;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.wa-bubble{
  background:rgba(37,211,102,0.1);
  border:1px solid rgba(37,211,102,0.15);
  border-radius:12px 12px 12px 4px;
  padding:14px 16px;
  max-width:85%;
  font-size:0.82rem;
  line-height:1.6;
  color:rgba(255,255,255,0.75);
}
.wa-bubble b{color:#fff;}
.wa-bubble .wa-link{
  display:inline-block;
  margin-top:8px;
  color:#25D366;
  font-size:0.78rem;
  text-decoration:none;
}
.wa-time{font-size:0.65rem;color:rgba(255,255,255,0.25);text-align:right;margin-top:4px;}
.wa-send-row{
  display:flex;
  gap:10px;
  padding:16px 20px;
  background:#111;
  border-top:1px solid rgba(255,255,255,0.04);
  align-items:center;
}
.wa-input-fake{
  flex:1;
  background:rgba(255,255,255,0.05);
  border-radius:100px;
  padding:10px 16px;
  font-size:0.78rem;
  color:rgba(255,255,255,0.25);
}
.wa-send-btn{
  width:36px;height:36px;
  border-radius:50%;
  background:#25D366;
  display:flex;align-items:center;justify-content:center;
}
.wa-send-btn svg{width:16px;height:16px;fill:#fff;}

/* ── HOW IT WORKS ── */
.how-sec{background:var(--cream);}

.how-steps{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:0;
  margin-top:72px;
  position:relative;
}
.how-steps::before{
  content:'';
  position:absolute;
  top:28px;left:10%;right:10%;
  height:2px;
  background:linear-gradient(90deg,var(--lime),var(--sky),var(--violet),var(--coral));
  z-index:0;
}

.how-step{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:0 16px;
  position:relative;
  z-index:1;
}

.step-circle{
  width:56px;height:56px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;
  font-size:1.1rem;
  font-weight:800;
  margin-bottom:20px;
  border:3px solid;
  background:var(--cream);
}
.sc-1{color:var(--lime);border-color:var(--lime);}
.sc-2{color:var(--sky);border-color:var(--sky);}
.sc-3{color:var(--violet);border-color:var(--violet);}
.sc-4{color:var(--coral);border-color:var(--coral);}
.sc-5{color:#25D366;border-color:#25D366;}

.how-step-title{
  font-family:'Syne',sans-serif;
  font-size:0.82rem;
  font-weight:700;
  margin-bottom:8px;
  color:var(--ink);
}
.how-step-desc{
  font-size:0.78rem;
  font-weight:300;
  line-height:1.6;
  color:var(--mid);
}

/* ── USE CASES ── */
.use-sec{
  background:var(--ink);
}

.use-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  margin-top:64px;
}

.use-card{
  border-radius:16px;
  padding:40px;
  position:relative;
  overflow:hidden;
  transition:transform 0.3s;
}
.use-card:hover{transform:scale(1.02);}

.uc-1{background:linear-gradient(135deg,rgba(200,255,0,0.08),rgba(200,255,0,0.02));border:1px solid rgba(200,255,0,0.15);}
.uc-2{background:linear-gradient(135deg,rgba(255,92,58,0.08),rgba(255,92,58,0.02));border:1px solid rgba(255,92,58,0.15);}
.uc-3{background:linear-gradient(135deg,rgba(58,171,255,0.08),rgba(58,171,255,0.02));border:1px solid rgba(58,171,255,0.15);}
.uc-4{background:linear-gradient(135deg,rgba(155,94,255,0.08),rgba(155,94,255,0.02));border:1px solid rgba(155,94,255,0.15);}

.use-emoji{font-size:2.8rem;margin-bottom:20px;display:block;}
.use-card-eyebrow{
  font-size:0.68rem;font-weight:700;letter-spacing:0.2em;
  text-transform:uppercase;margin-bottom:10px;
}
.uce-1{color:var(--lime);}
.uce-2{color:var(--coral);}
.uce-3{color:var(--sky);}
.uce-4{color:var(--violet);}

.use-card-title{
  font-family:'Syne',sans-serif;
  font-size:1.3rem;font-weight:800;
  color:#fff;margin-bottom:12px;
}
.use-card-body{
  font-size:0.86rem;font-weight:300;
  line-height:1.7;color:rgba(255,255,255,0.45);
}

/* ── PRICING ── */
.pricing-sec{background:var(--cream);}

.price-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:64px;
}
.price-card{
  border-radius:16px;
  padding:40px 36px;
