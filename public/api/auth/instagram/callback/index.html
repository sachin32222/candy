<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0;url=/dashboard/automations" />
    <script>
      (function () {
        var returnTo = "/dashboard/automations";
        try {
          var params = new URLSearchParams(window.location.search);
          var stateRaw = params.get("state");
          if (stateRaw) {
            var stateObj = JSON.parse(decodeURIComponent(stateRaw));
            if (stateObj && stateObj.returnTo) {
              returnTo = stateObj.returnTo;
            }
          }
          localStorage.setItem("candei_instagram_connected", "true");
        } catch (e) {}
        window.location.replace(returnTo);
      })();
    </script>
  </head>
  <body style="background:#000;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
    <p>Redirecting to dashboard...</p>
  </body>
</html>
